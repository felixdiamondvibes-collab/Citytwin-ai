<!DOCTYPE html>
<html>
<head>
  <title>City Twin AI</title>

  <link rel="stylesheet" href="style.css">

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet/dist/leaflet.css"
  />
</head>

<body>

<header>
  <h1>🏙️ CITY TWIN AI</h1>
  <p>Digital Twin Infrastructure For Smart Cities</p>
</header>

<div class="dashboard">

  <div class="card">
    <h2>Traffic</h2>
    <p>High</p>
  </div>

  <div class="card">
    <h2>Flood Risk</h2>
    <p>Low</p>
  </div>

  <div class="card">
    <h2>Emergency</h2>
    <p>Stable</p>
  </div>
  
<div class="card">
  <h2>AI Prediction</h2>
  <p id="prediction">Analyzing...</p>
</div>
  
  <div class="card">
  <h2>Weather Risk</h2>
  <p id="weatherRisk">Monitoring</p>
  </div>
  
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="app.js"></script>

</body>
</html>
